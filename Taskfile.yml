version: '3'

# Local development only. Production is configured separately through
# deploy/.env and Docker Compose's --env-file option.
dotenv:
  - .env.local

vars:
  GHCR_OWNER: '{{default "tigerofcountryyao" .GHCR_OWNER}}'
  BACKEND_IMAGE: 'ghcr.io/{{.GHCR_OWNER}}/biliaudiocut-backend'
  WEB_IMAGE: 'ghcr.io/{{.GHCR_OWNER}}/biliaudiocut-web'
  RELEASE_GOPROXY: '{{default "https://proxy.golang.org,direct" .RELEASE_GOPROXY}}'
  RELEASE_GOSUMDB: '{{default "sum.golang.org" .RELEASE_GOSUMDB}}'

tasks:
  air:install:
    internal: true
    desc: Install the Go live-reload tool used by dev:api.
    dir: backend
    cmds:
      - go install github.com/air-verse/air@latest

  goose:install:
    internal: true
    desc: Install the SQL migration tool.
    dir: backend
    cmds:
      - go install github.com/pressly/goose/v3/cmd/goose@latest

  sqlc:install:
    internal: true
    desc: Install the SQL query code generator.
    dir: backend
    cmds:
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

  tools:install:
    internal: true
    desc: Install the development tools required by this repository.
    deps:
      - air:install
      - goose:install
      - sqlc:install

  setup:
    desc: Prepare a development environment and apply pending migrations.
    deps:
      - tools:install
    cmds:
      - go -C backend mod tidy
      - task db:migrate:up
      - task db:generate

  dev:
    desc: Run the Go entry point with Air live reload.
    dir: backend
    cmds:
      - air -c .air.toml

  go:fmt:
    desc: Format all Go packages.
    dir: backend
    cmds:
      - go fmt ./...

  go:tidy:
    internal: true
    desc: Add missing module requirements and remove unused ones.
    dir: backend
    cmds:
      - go mod tidy

  go:vet:
    internal: true
    desc: Run Go static analysis.
    dir: backend
    cmds:
      - go vet ./...

  go:test:
    internal: true
    desc: Run all Go tests.
    dir: backend
    cmds:
      - go test ./...

  check:
    desc: Run the non-mutating Go quality checks.
    deps:
      - go:vet
      - go:test

  db:migrate:status:
    desc: Show the current database migration version.
    dir: backend
    vars:
      DATABASE_URL: '{{default "postgres://product_video:local-dev-only@127.0.0.1:15432/product_video?sslmode=disable" .DATABASE_URL}}'
    cmds:
      - goose -dir internal/platform/database/migrations postgres "{{.DATABASE_URL}}" status

  db:migrate:up:
    desc: Apply all pending database migrations.
    dir: backend
    vars:
      DATABASE_URL: '{{default "postgres://product_video:local-dev-only@127.0.0.1:15432/product_video?sslmode=disable" .DATABASE_URL}}'
    cmds:
      - goose -dir internal/platform/database/migrations postgres "{{.DATABASE_URL}}" up

  db:migrate:down:
    desc: Roll back the most recently applied database migration.
    dir: backend
    vars:
      DATABASE_URL: '{{default "postgres://product_video:local-dev-only@127.0.0.1:15432/product_video?sslmode=disable" .DATABASE_URL}}'
    cmds:
      - goose -dir internal/platform/database/migrations postgres "{{.DATABASE_URL}}" down

  db:migration:new:
    desc: "Create a SQL migration; usage: task db:migration:new -- create_users"
    dir: backend
    cmds:
      - goose -dir internal/platform/database/migrations create {{.CLI_ARGS}} sql

  db:generate:
    desc: Generate typed Go query code from SQL.
    dir: backend
    cmds:
      - sqlc generate

  docker:build:
    desc: Build the Go container image.
    cmds:
      - docker build -f backend/dockerfile backend

  release:login:
    desc: Log in to GHCR interactively with a token that has write:packages.
    cmds:
      - docker login ghcr.io -u {{.GHCR_OWNER}}

  release:build:
    desc: "Build production linux/amd64 images; usage: task release:build VERSION=<version> PUBLIC_ORIGIN=https://example.com"
    requires:
      vars: [VERSION, PUBLIC_ORIGIN]
    vars:
      GIT_REVISION:
        sh: git rev-parse HEAD
    cmds:
      - docker buildx build --platform linux/amd64 --load -t {{.BACKEND_IMAGE}}:{{.VERSION}} --build-arg APP_VERSION={{.VERSION}} --build-arg VCS_REF={{.GIT_REVISION}} --build-arg GOPROXY={{.RELEASE_GOPROXY}} --build-arg GOSUMDB={{.RELEASE_GOSUMDB}} -f backend/dockerfile backend
      - docker buildx build --platform linux/amd64 --load -t {{.WEB_IMAGE}}:{{.VERSION}} --build-arg APP_VERSION={{.VERSION}} --build-arg VCS_REF={{.GIT_REVISION}} --build-arg WXT_API_ORIGIN={{.PUBLIC_ORIGIN}} --build-arg WXT_PUBLIC_ORIGIN={{.PUBLIC_ORIGIN}} --build-arg API_ORIGIN=http://api:8080 -f frontend/dockerfile .

  release:push:
    desc: "Push a built version and update the stable tag; usage: task release:push VERSION=<version>"
    requires:
      vars: [VERSION]
    cmds:
      - docker push {{.BACKEND_IMAGE}}:{{.VERSION}}
      - docker push {{.WEB_IMAGE}}:{{.VERSION}}
      - docker tag {{.BACKEND_IMAGE}}:{{.VERSION}} {{.BACKEND_IMAGE}}:stable
      - docker tag {{.WEB_IMAGE}}:{{.VERSION}} {{.WEB_IMAGE}}:stable
      - docker push {{.BACKEND_IMAGE}}:stable
      - docker push {{.WEB_IMAGE}}:stable

  release:
    desc: "Build and push a production release manually; usage: task release VERSION=<version> PUBLIC_ORIGIN=https://example.com"
    requires:
      vars: [VERSION, PUBLIC_ORIGIN]
    cmds:
      - task: release:build
        vars:
          VERSION: '{{.VERSION}}'
          PUBLIC_ORIGIN: '{{.PUBLIC_ORIGIN}}'
      - task: release:push
        vars:
          VERSION: '{{.VERSION}}'

  dev:web:
    desc: Run the Next.js web application on http://localhost:3000 with its own build cache.
    dir: frontend
    cmds:
      - npm run dev

  web:install:
    desc: Install web application dependencies.
    dir: frontend
    cmds:
      - npm install

  extension:install:
    desc: Install Chrome extension dependencies.
    dir: extension
    cmds:
      - npm install

  extension:build:
    desc: Build the unpacked Chrome extension.
    dir: extension
    cmds:
      - npm run build

  extension:package:
    desc: Build the Chrome extension ZIP for the website download button.
    dir: extension
    cmds:
      - npm run package
