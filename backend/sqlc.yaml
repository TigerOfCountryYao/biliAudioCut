version: "2"

sql:
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/identity/queries
    gen:
      go:
        package: identitysqlc
        out: internal/identity/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true