name: product-video-studio-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: product_video
      POSTGRES_USER: product_video
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_video -d product_video"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: