name: biliaudiocut

services:
  postgres:
    # PostgreSQL 15 is available in the NAS local image cache and supports all
    # current migrations. Keep the major version explicit for reproducibility.
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: ${BACKEND_IMAGE}:${APP_VERSION:-stable}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    entrypoint: ["/usr/local/bin/goose"]
    command: ["-dir", "/migrations", "postgres", "${DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${BACKEND_IMAGE}:${APP_VERSION:-stable}
    restart: unless-stopped
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    image: ${BACKEND_IMAGE}:${APP_VERSION:-stable}
    profiles: ["admin"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    entrypoint: ["/app/admin"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE}:${APP_VERSION:-stable}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  gateway:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "${LISTEN_ADDRESS:-0.0.0.0}:${LISTEN_PORT:-18089}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    profiles: ["tunnel"]
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN}"]
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres-data:
